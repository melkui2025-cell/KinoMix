name: Build KinoMix APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          unzip KinoMixAndroid_source_v2.zip -d project
          cd project/KinoMixAndroid
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KinoMix-APK
          path: project/KinoMixAndroid/app/build/outputs/apk/debug/*.apk
